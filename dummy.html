<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummy Page</title>
</head>
<body>
    <h1>Hello, World!</h1>
    <p id="dynamic-text">This is a dummy HTML file.</p>
    <button onclick="changeText()">Click me to change the text!</button>

    <script>
        function changeText() {
            document.getElementById('dynamic-text').innerText = 'The text has been dynamically changed!';
        }
    </script>
</body>
</html>
