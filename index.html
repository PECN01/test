<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A dummy HTML project for testing dynamic elements with JavaScript.">
    <title>Index Page</title>
</head>
<body>
    <!-- Description: This is a dummy HTML project created for testing purposes. It includes a heading, a paragraph, and a button that changes the text of the paragraph when clicked. The JavaScript function `changeText()` is responsible for updating the content of the paragraph with the id "dynamic-text". -->
    <h1>Hello, World!</h1>
    <p id="dynamic-text">This is a dummy HTML file.</p>
    <button onclick="changeText()">Click me to change the text!</button>

    <script>
        function changeText() {
            document.getElementById('dynamic-text').innerText = 'The text has been dynamically changed!';
        }
    </script>
</body>
</html>
